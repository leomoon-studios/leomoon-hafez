[build-system]
requires = ["setuptools>=84.2.1,<85", "setuptools-scm[simple]>=10.3.4,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "leomoon-hafez"
dynamic = ["version"]
description = "Browse Hafez poems with Persian typography and recitations."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "LeoMoon Studios" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.12,<7",
    "darkdetect>=0.8,<0.9",
    "natsort>=8.4,<9",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.22.3,<7",
    "setuptools-scm>=10.3.4,<11",
    "uv>=0.13.5,<1",
]
test = [
    "pip-audit>=2.10,<3",
    "pytest>=9.1.1,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.17.2,<1",
]

[project.gui-scripts]
leomoon-hafez = "leomoon_hafez.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["leomoon_hafez*"]

[tool.setuptools.package-data]
leomoon_hafez = [
    "assets/audio/*.wav",
    "assets/data/*.zip",
    "assets/fonts/*",
    "assets/icons/*",
    "ui/*.qrc",
    "ui/*.ui",
]

[tool.setuptools_scm]
version_file = "src/leomoon_hafez/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/leomoon_hafez/_generated"]

[tool.ruff.lint]
select = ["F"]
