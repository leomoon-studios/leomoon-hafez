name: macOS

on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      release_date: { required: true, type: string }
      commit: { required: true, type: string }
    secrets:
      MACOS_SIGNING_CERTIFICATE_BASE64: { required: false }
      MACOS_SIGNING_CERTIFICATE_PASSWORD: { required: false }
      MACOS_APPLICATION_SIGNING_IDENTITY: { required: false }
      MACOS_NOTARY_APPLE_ID: { required: false }
      MACOS_NOTARY_TEAM_ID: { required: false }
      MACOS_NOTARY_APP_PASSWORD: { required: false }

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-arm64:
    name: Build and test (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }

      - name: Create locked project environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "uv==0.13.5"
          .venv/bin/uv sync --all-extras --locked

      - name: Regenerate Qt and test
        shell: bash
        run: |
          .venv/bin/python scripts/generate_qt.py
          git diff --exit-code -- src/leomoon_hafez/_generated/main_window.py
          .venv/bin/python -m ruff check src tests scripts
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME='' QT_STYLE_OVERRIDE=Fusion .venv/bin/python -m pytest -q -rs
          .venv/bin/python -m pip check

      - name: Build one-directory application
        shell: bash
        run: .venv/bin/python scripts/build.py --version "${{ inputs.version }}" --release-date "${{ inputs.release_date }}" --commit "${{ inputs.commit }}" --output-dir build/macos-arm64 --clean

      - name: Verify one-directory application
        shell: bash
        run: |
          .venv/bin/python scripts/verify_bundle.py build/macos-arm64/release-manifest.json "${{ inputs.version }}" arm64
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME='' QT_STYLE_OVERRIDE=Fusion .venv/bin/python scripts/smoke_bundle.py "build/macos-arm64/leomoon-hafez/LeoMoon Hafez.app/Contents/MacOS/LeoMoon Hafez"

      - name: Prepare optional signing and notarization
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "Unsigned ARM64 DMG: signing certificate is not configured."
            echo "artifact_label=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          certificate="$RUNNER_TEMP/leomoon-hafez-signing.p12"
          keychain="$RUNNER_TEMP/leomoon-hafez-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "HAFEZ_MACOS_CODESIGN_IDENTITY=$APPLICATION_IDENTITY" >> "$GITHUB_ENV"
          echo "HAFEZ_MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "artifact_label=signed" >> "$GITHUB_OUTPUT"
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_TEAM_ID" && -n "$NOTARY_PASSWORD" ]]; then
            xcrun notarytool store-credentials leomoon-hafez-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
            echo "HAFEZ_MACOS_NOTARY_PROFILE=leomoon-hafez-notary" >> "$GITHUB_ENV"
            echo "HAFEZ_MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi

      - name: Package and verify ARM64 DMG
        shell: bash
        run: bash scripts/package-macos.sh --stage-dir build/macos-arm64/leomoon-hafez --dist-dir dist --version "${{ inputs.version }}" --release-date "${{ inputs.release_date }}" --commit "${{ inputs.commit }}" --architecture arm64

      - name: Retain raw bundle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-hafez-macos-arm64-failure-${{ github.sha }}
          path: build/macos-arm64/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-hafez-macos-arm64-${{ steps.signing.outputs.artifact_label }}-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          [[ -z "${HAFEZ_MACOS_SIGNING_KEYCHAIN:-}" ]] || security delete-keychain "$HAFEZ_MACOS_SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/leomoon-hafez-signing.p12"

  clean-dmg-smoke:
    name: Clean ARM64 DMG smoke test
    needs: build-and-test-arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out smoke test script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: leomoon-hafez-macos-arm64-*-release-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Mount, copy, launch, and remove the application
        shell: bash
        run: bash scripts/smoke-macos-dmg.sh dist "${{ inputs.version }}" arm64
