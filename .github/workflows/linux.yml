name: Linux

on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      release_date: { required: true, type: string }
      commit: { required: true, type: string }
      arch: { required: false, default: all, type: string }

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.release_arch }})
    runs-on: ${{ matrix.release_arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release_arch: ${{ fromJSON(inputs.arch == 'x64' && '["x86_64"]' || inputs.arch == 'arm64' && '["aarch64"]' || '["x86_64","aarch64"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes fontconfig libasound2t64 libdbus-1-3 libegl1 libfontconfig1 libgl1 libopengl0 libpulse0 libwayland-client0 libwayland-cursor0 libx11-6 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 xvfb

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }

      - name: Create locked project environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "uv==0.13.5"
          .venv/bin/uv sync --all-extras --locked

      - name: Regenerate Qt and test
        shell: bash
        run: |
          .venv/bin/python scripts/generate_qt.py
          git diff --exit-code -- src/leomoon_hafez/_generated
          .venv/bin/python -m ruff check src tests scripts
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME='' QT_STYLE_OVERRIDE=Fusion .venv/bin/python -m pytest -q -rs
          .venv/bin/python -m pip check

      - name: Build one-directory application
        shell: bash
        run: .venv/bin/python scripts/build.py --version "${{ inputs.version }}" --release-date "${{ inputs.release_date }}" --commit "${{ inputs.commit }}" --output-dir "build/linux-${{ matrix.release_arch }}" --clean

      - name: Verify manifest and smoke-test bundle
        shell: bash
        run: |
          .venv/bin/python scripts/verify_bundle.py "build/linux-${{ matrix.release_arch }}/release-manifest.json" "${{ inputs.version }}" "${{ matrix.release_arch }}"
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME='' QT_STYLE_OVERRIDE=Fusion .venv/bin/python scripts/smoke_bundle.py "build/linux-${{ matrix.release_arch }}/leomoon-hafez/LeoMoon Hafez"

      - name: Retain raw bundle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-hafez-linux-${{ matrix.release_arch }}-failure-${{ github.sha }}
          path: build/linux-${{ matrix.release_arch }}/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux bundle diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-hafez-linux-${{ matrix.release_arch }}-build-${{ github.sha }}
          path: build/linux-${{ matrix.release_arch }}/
          if-no-files-found: error
          retention-days: 14
